name: docker-setup

description: Setup Docker environment for QEMU, Buildx, and the GitHub Container Registry login

inputs:
  login_enabled:
    description: "Enable or disable the login"
    default: true
    required: false
  github_token:
    description: "Set to enable GitHub Container Registry login"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      if: ${{ inputs.login_enabled && inputs.github_token }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}
